<svg width="200" height="140" viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bookGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#8E7BFF"/>
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00B894"/>
      <stop offset="100%" stop-color="#55EFC4"/>
    </linearGradient>
  </defs>

  <!-- open book -->
  <path d="M20 100 L20 40 Q20 32 30 32 L92 32 L92 108 L30 108 Q20 108 20 100 Z" fill="url(#bookGrad)"/>
  <path d="M180 100 L180 40 Q180 32 170 32 L108 32 L108 108 L170 108 Q180 108 180 100 Z" fill="url(#bookGrad)" opacity="0.85"/>
  <line x1="100" y1="30" x2="100" y2="110" stroke="#4A3FBF" stroke-width="2"/>

  <!-- page lines -->
  <line x1="30" y1="48" x2="80" y2="48" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <line x1="30" y1="60" x2="80" y2="60" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="30" y1="72" x2="70" y2="72" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="120" y1="48" x2="170" y2="48" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <line x1="120" y1="60" x2="170" y2="60" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="120" y1="72" x2="160" y2="72" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- translation speech bubble -->
  <g transform="translate(128,4)">
    <path d="M0 14 Q0 0 14 0 L54 0 Q68 0 68 14 L68 30 Q68 44 54 44 L20 44 L8 54 L10 44 L14 44 Q0 44 0 30 Z" fill="url(#bubbleGrad)"/>
    <text x="34" y="28" font-family="sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">A → 文</text>
  </g>
</svg>
