<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/lino/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Lino — multilingual language learning with spaced repetition, A1–C2 courses, grammar, idioms and pronunciation.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Lino">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Lino — Language Learning</title>
  <link rel="manifest" href="manifest.json">

  <script>
    let linoDeferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      linoDeferredInstallPrompt = event;
    });
    window.addEventListener('appinstalled', () => {
      linoDeferredInstallPrompt = null;
    });
    window.linoCanInstallPwa = function () {
      return !!linoDeferredInstallPrompt;
    };
    window.linoIsStandalone = function () {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    };
    window.linoPromptPwaInstall = async function () {
      if (!linoDeferredInstallPrompt) return 'unavailable';
      const promptEvent = linoDeferredInstallPrompt;
      await promptEvent.prompt();
      const choice = await promptEvent.userChoice;
      linoDeferredInstallPrompt = null;
      return choice && choice.outcome ? choice.outcome : 'dismissed';
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
